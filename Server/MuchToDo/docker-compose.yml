services:
  mongodb:
    image: mongo:8.0
    container_name: muchtodo-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: much_todo_db

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - muchtodo-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    container_name: muchtodo-backend

    restart: unless-stopped

    depends_on:
      mongodb:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      PORT: "8080"
      DB_NAME: "much_todo_db"

      MONGO_URI: "mongodb://admin:password@mongodb:27017/much_todo_db?authSource=admin"

      JWT_SECRET_KEY: "supersecretkey"
      JWT_EXPIRATION_HOURS: "72"

      ENABLE_CACHE: "false"

      LOG_LEVEL: "INFO"
      LOG_FORMAT: "json"

    networks:
      - muchtodo-network

volumes:
  mongo_data:

networks:
  muchtodo-network:
    driver: bridge
